<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassMate - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.263.1/font/lucide.min.css">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/css/pages/auth.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-left">
            <div class="auth-form-container animate-fade-in">
                <div class="auth-logo">
                    <span class="logo-icon">C</span>
                    <span class="logo-text">ClassMate</span>
                </div>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Enter your credentials to access your account</p>

                <div class="auth-alert" id="authAlert"></div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="you@school.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-toggle">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" id="togglePassword">
                                <i class="icon-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="forgot-link">
                        <a href="#">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                </form>

                <div class="auth-footer">
                    <p>Do not have an account? <a href="/register">Create one</a></p>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-right-content">
                <h2>Manage Your School Smarter</h2>
                <p>A modern platform designed to streamline operations, engage stakeholders, and drive academic excellence.</p>
            </div>
        </div>
    </div>

    <script src="/static/js/utils/api.js"></script>
    <script src="/static/js/pages/login.js"></script>
</body>
</html>
